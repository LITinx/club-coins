openapi: 3.0.3
info:
  title: Student Club Coin Rewards API
  description: API for managing virtual coin rewards in a student club
  version: 1.0.0

servers:
  - url: /api
    description: Next.js API routes

components:
  securitySchemes:
    supabaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 100
        role:
          type: string
          enum: [student, admin]
        balance:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - display_name
        - role
        - balance
        - status

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [award, transfer, redemption]
        amount:
          type: integer
          minimum: 1
        from_user_id:
          type: string
          format: uuid
          nullable: true
        from_user:
          $ref: '#/components/schemas/UserSummary'
        to_user_id:
          type: string
          format: uuid
        to_user:
          $ref: '#/components/schemas/UserSummary'
        reward_id:
          type: string
          format: uuid
          nullable: true
        reward:
          $ref: '#/components/schemas/RewardSummary'
        description:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - amount
        - to_user_id
        - created_at

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
        - id
        - display_name

    RewardSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name

    Reward:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        cost:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 0
        quantity_remaining:
          type: integer
          minimum: 0
        image_url:
          type: string
          format: uri
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - cost
        - quantity
        - quantity_remaining
        - is_active

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [award, transfer_received, transfer_sent, redemption]
        title:
          type: string
          maxLength: 200
        message:
          type: string
        read:
          type: boolean
        data:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - message
        - read
        - created_at

    ClubStats:
      type: object
      properties:
        total_members:
          type: integer
        active_members:
          type: integer
        total_coins_distributed:
          type: integer
        total_coins_redeemed:
          type: integer
        total_coins_in_circulation:
          type: integer
        recent_transactions:
          type: integer
          description: Transactions in the last 7 days
      required:
        - total_members
        - active_members
        - total_coins_distributed
        - total_coins_redeemed
        - total_coins_in_circulation
        - recent_transactions

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
      required:
        - data
        - total
        - page
        - page_size
        - has_more

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

security:
  - supabaseAuth: []

paths:
  /user/me:
    get:
      summary: Get current user profile
      tags: [User]
      responses:
        '200':
          description: Current user profile with balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update current user profile
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /transactions:
    get:
      summary: Get current user's transaction history
      tags: [Transactions]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: type
          in: query
          schema:
            type: string
            enum: [award, transfer, redemption]
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'

  /transactions/transfer:
    post:
      summary: Transfer coins to another user
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to_user_id:
                  type: string
                  format: uuid
                amount:
                  type: integer
                  minimum: 1
                description:
                  type: string
                  maxLength: 500
              required:
                - to_user_id
                - amount
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid request (insufficient balance, self-transfer, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rewards:
    get:
      summary: Get available rewards
      tags: [Rewards]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated reward list (active only for students)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Reward'

  /rewards/{id}/redeem:
    post:
      summary: Redeem a reward
      tags: [Rewards]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Redemption successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Insufficient balance or reward unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reward not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications:
    get:
      summary: Get user notifications
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paginated notification list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'

  /notifications/unread-count:
    get:
      summary: Get unread notification count
      tags: [Notifications]
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /notifications/{id}/read:
    post:
      summary: Mark notification as read
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

  /notifications/read-all:
    post:
      summary: Mark all notifications as read
      tags: [Notifications]
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer

  # Admin endpoints
  /admin/members:
    get:
      summary: Get all club members (admin only)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
      responses:
        '200':
          description: Paginated member list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/members/{id}/award:
    post:
      summary: Award coins to a member (admin only)
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  minimum: 1
                description:
                  type: string
                  maxLength: 500
              required:
                - amount
                - description
      responses:
        '201':
          description: Coins awarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '403':
          description: Admin access required
        '404':
          description: Member not found

  /admin/members/{id}/status:
    patch:
      summary: Update member status (admin only)
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, inactive]
              required:
                - status
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /admin/rewards:
    get:
      summary: Get all rewards including inactive (admin only)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated reward list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Reward'

    post:
      summary: Create a new reward (admin only)
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                cost:
                  type: integer
                  minimum: 1
                quantity:
                  type: integer
                  minimum: 0
                image_url:
                  type: string
                  format: uri
              required:
                - name
                - cost
                - quantity
      responses:
        '201':
          description: Reward created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'

  /admin/rewards/{id}:
    patch:
      summary: Update a reward (admin only)
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                cost:
                  type: integer
                  minimum: 1
                quantity:
                  type: integer
                  minimum: 0
                image_url:
                  type: string
                  format: uri
                is_active:
                  type: boolean
      responses:
        '200':
          description: Reward updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'

  /admin/stats:
    get:
      summary: Get club-wide statistics (admin only)
      tags: [Admin]
      responses:
        '200':
          description: Club statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubStats'

  /admin/transactions:
    get:
      summary: Get all transactions (admin only)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: type
          in: query
          schema:
            type: string
            enum: [award, transfer, redemption]
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'

  /users/search:
    get:
      summary: Search users for transfer recipient
      tags: [User]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query (name or email)
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
                maxItems: 10
